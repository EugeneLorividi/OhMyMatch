{% extends "base.html" %}
{% block title %}{{ t("dislikes.title") }} · OhMyMatch{% endblock %}
{% block content %}
  <h1>{{ t("dislikes.title") }}</h1>
  {% include "_errors.html" %}
  <p>{{ t("dislikes.intro") }}</p>
  <form method="post" action="/dislikes">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="grid">
      {% for category in categories %}
        <label class="check"><input type="checkbox" name="category" value="{{ category.key }}"{% if category.key in selected %} checked{% endif %}> {{ category.name }}</label>
      {% endfor %}
    </div>
    <button type="submit">{{ t("common.save") }}</button>
  </form>
{% endblock %}
