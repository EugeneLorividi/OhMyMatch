{% extends "base.html" %}
{% block title %}Вход · OhMyMatch{% endblock %}
{% block content %}
  <h1>Вход</h1>
  {% include "_errors.html" %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="handle">Ник</label>
    <input id="handle" name="handle" required autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64">
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" required maxlength="{{ password_max }}" autocomplete="current-password">
    <button type="submit">Войти</button>
  </form>
  <p><a href="/recover">Забыл(а) пароль</a></p>
{% endblock %}
