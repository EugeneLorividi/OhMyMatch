{% extends "base.html" %}
{% block title %}{{ t("recover.title") }} · OhMyMatch{% endblock %}
{% block content %}
  <h1>{{ t("recover.title") }}</h1>
  {% include "_errors.html" %}
  <p>{{ t("recover.intro") }}</p>
  <form method="post" action="/recover">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="handle">{{ t("login.handle") }}</label>
    <input id="handle" name="handle" required autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64">
    <label for="recovery_code">{{ t("recover.code") }}</label>
    <input id="recovery_code" name="recovery_code" required autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="64">
    <label for="password">{{ t("recover.new_password", min=password_min) }}</label>
    <input id="password" name="password" type="password" required minlength="{{ password_min }}" maxlength="{{ password_max }}" autocomplete="new-password">
    <label for="password_confirm">{{ t("recover.new_password_confirm") }}</label>
    <input id="password_confirm" name="password_confirm" type="password" required minlength="{{ password_min }}" maxlength="{{ password_max }}" autocomplete="new-password">
    <button type="submit">{{ t("recover.submit") }}</button>
  </form>
{% endblock %}
