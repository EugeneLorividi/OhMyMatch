{% extends "base.html" %}
{% block title %}{{ t("register.title") }} · OhMyMatch{% endblock %}
{% block content %}
  <h1>{{ t("register.title") }}</h1>
  {% include "_errors.html" %}
  <form method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="step" value="code">
    <label for="invite_code">{{ t("register.invite_code") }}</label>
    <input id="invite_code" name="invite_code" required autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="64">
    <button type="submit">{{ t("common.next") }}</button>
  </form>
{% endblock %}
