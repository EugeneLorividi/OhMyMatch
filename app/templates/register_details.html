{% extends "base.html" %}
{% block title %}{{ t("register.title") }} · OhMyMatch{% endblock %}
{% block content %}
  <h1>{{ t("register.title") }}</h1>
  {% include "_errors.html" %}

  <p>{{ t("register.your_handle") }} <strong class="handle">{{ handle }}</strong></p>
  <form method="post" action="/register" class="inline">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="step" value="regen">
    <input type="hidden" name="invite_code" value="{{ invite_code }}">
    <button type="submit" class="secondary">{{ t("register.another_handle") }}</button>
  </form>

  {% include "_consent.html" %}

  <form method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="step" value="details">
    <input type="hidden" name="invite_code" value="{{ invite_code }}">
    <input type="hidden" name="handle" value="{{ handle }}">
    <label class="check"><input type="checkbox" name="age_confirmed" value="yes" required{% if age_checked %} checked{% endif %}> {{ t("register.age") }}</label>
    <label class="check"><input type="checkbox" name="consent" value="yes" required{% if consent_checked %} checked{% endif %}> {{ t("register.consent") }}</label>
    <label for="password">{{ t("register.password", min=password_min) }}</label>
    <input id="password" name="password" type="password" required minlength="{{ password_min }}" maxlength="{{ password_max }}" autocomplete="new-password">
    <label for="password_confirm">{{ t("register.password_confirm") }}</label>
    <input id="password_confirm" name="password_confirm" type="password" required minlength="{{ password_min }}" maxlength="{{ password_max }}" autocomplete="new-password">
    <button type="submit">{{ t("register.submit") }}</button>
  </form>
{% endblock %}
