# Throwaway test setup. Data lives in tmpfs only.
# Full suite (with Tesseract): docker compose -f compose.test.yml run --rm --build tests
# Host run (OCR image tests skip): docker compose -f compose.test.yml up -d testdb, then
#   TEST_DATABASE_URL=postgresql+psycopg://test:test@127.0.0.1:55432/test uv run pytest
name: ohmymatch-test

services:
  testdb:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 15

  tests:
    build:
      context: .
      target: test
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - .:/app:ro
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@testdb:5432/test
      REQUIRE_TESSERACT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      testdb:
        condition: service_healthy
