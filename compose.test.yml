# Throwaway database for running tests on the host. Data lives in tmpfs only.
# Usage: docker compose -f compose.test.yml up -d
#        TEST_DATABASE_URL=postgresql+psycopg://test:test@127.0.0.1:55432/test uv run pytest
name: ohmymatch-test

services:
  testdb:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 15
