# Same proxy headers as deploy/nginx.conf.example (tests/test_deploy_examples.py checks it),
# plain HTTP because this runs only inside the throwaway check network.
server {
    listen 8080;
    location / {
        proxy_pass http://10.231.0.3:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite, never append: the app trusts this value for per-IP rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}
